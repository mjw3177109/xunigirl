<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"/><title>小雅 · VoiceCompanion</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">✦</div><div><b>VoiceCompanion</b><small>DeepSeek · RTX 4090</small></div></div>
    <button id="newChat" class="primary wide">＋ 创建新对话</button>
    <div class="sideTitle">最近对话</div><div id="sessions" class="sessions"></div>
    <div class="sidebarFoot"><div class="statusLine"><span id="apiLamp" class="lamp"></span><span id="apiLabel">检查 DeepSeek…</span></div><div class="statusLine"><span id="voiceLamp" class="lamp"></span><span id="voiceLabel">检查本地语音…</span></div><div id="gpuLabel" class="gpu">正在检查 GPU…</div></div>
  </aside>
  <main class="main"><header class="topbar"><div><h1>和小雅聊聊吧</h1><p>真正独立运行 · 无需 DSH · 云端 LLM + 本地语音</p></div><div class="topActions"><button id="stop" class="ghost danger" disabled>■ 停止</button><button id="clear" class="ghost">清空当前</button></div></header>
   <section class="content"><div class="chatcol"><div id="messages" class="messages" aria-live="polite"><div class="welcome"><div class="welcomeOrb">✦</div><h2>你好呀，今天想聊什么？</h2><p>我可以用文字和你聊天，也可以听你说话、读出回复。</p></div></div>
    <div id="notice" class="notice" hidden></div>
    <form id="composer" class="composer"><textarea id="text" rows="2" maxlength="4000" placeholder="发消息给小雅…（Enter 发送，Shift+Enter 换行）"></textarea><div class="composerFoot"><span id="recordStatus" class="hint">可切换语音输入</span><div class="composerButtons"><button type="button" id="mic" class="ghost" title="录音，再次点击结束">🎙️ 说话</button><button type="submit" id="send" class="primary">发送 ↗</button></div></div></form>
   </div><aside class="companion"><div class="sectionHeading"><span class="onlineDot"></span><b>数字人形象</b><span class="subtle">小雅</span></div><div class="avatarBox"><video id="avatarVideo" playsinline></video><div id="avatarPlaceholder"><img class="avatarPortrait" src="/portraits/xiaoya.png" alt="小雅：成年女性角色形象"/><div class="avatarCaption"><b>小雅</b><span>你的 AI 语音搭档</span></div></div><div class="videoState" id="videoState">待机</div></div>
   <div class="settings"><div class="settingLine"><label>回复模型</label><select id="model"><option value="deepseek-flash">DeepSeek Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select></div><div class="settingLine"><label>自动朗读</label><input id="speak" type="checkbox" checked></div><div class="settingLine"><label>QQ 私聊联动（可选）</label><input id="qq" type="checkbox"></div><div class="settingLine"><label>免按键插话（建议耳机）</label><input id="autoBarge" type="checkbox"></div><div class="settingLine"><label>数字人口播（较慢）</label><input id="digital" type="checkbox"></div><div class="settingLine"><label>音色</label><select id="voices"><option value="">未配置 / 加载中</option></select></div><div class="settingLine"><label>数字人形象</label><select id="avatars"><option value="">未配置</option></select></div><div class="settingLine"><label>待机动画</label><select id="idle"><option value="">默认</option></select></div><div class="settingLine"><label>补充人物设定</label></div><textarea id="persona" rows="3" placeholder="可选：比如，活泼一点，每次回复简短"></textarea><div class="help">音色与数字人依赖本地模型。普通文字聊天只需 DeepSeek API Key。关闭数字人口播后可即时朗读。</div><div class="memoryHead">长期记忆（手动保存/删除）</div><div id="memories" class="memories"></div><div class="memoryAdd"><input id="memoryInput" maxlength="500" placeholder="输入要记住的偏好…"><button type="button" id="addMemory" class="ghost">保存</button></div><div class="help">记忆存储在本机，作为后续聊天上下文发送给 DeepSeek；不要保存密码。</div></div>
   </aside></section>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body></html>
