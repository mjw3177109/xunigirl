name: Generate Xiaoya reference WAV
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-xiaoya-wav.yml"
      - "scripts/generate_reference_wav.py"
      - "voices/xiaoya/ref_text.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chinese speech synthesis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Synthesize reference speech
        run: python3 scripts/generate_reference_wav.py
      - name: Push reference WAV to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voices/xiaoya/ref_audio.wav
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add playable Xiaoya Chinese reference WAV'
            git push origin HEAD:main
          fi
