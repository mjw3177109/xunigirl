name: Kaggle Xiaoya Avatar Video Pilot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-xiaoya-avatar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare verified notebook metadata
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::KAGGLE_API_TOKEN missing"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("kaggle/kernel-metadata.json")
          p.write_text(json.dumps({
            "id":"mjw3177109/xunigirl-xiaoya-avatar-video-pilot",
            "title":"Xunigirl Xiaoya SadTalker GPU MP4 Pilot",
            "code_file":"xiaoya_t4_avatar_video_pilot.ipynb",
            "language":"python","kernel_type":"notebook",
            "is_private":True,"enable_gpu":True,
            "machine_shape":"NvidiaTeslaT4","enable_internet":True,
            "dataset_sources":[],"competition_sources":[],"kernel_sources":[],
            "model_sources":[]
          },indent=2),encoding="utf-8")
          PY
      - name: Install Kaggle CLI
        run: python -m pip install -q --upgrade kaggle
      - name: Submit actual T4 video inference
        run: kaggle kernels push -p kaggle --accelerator NvidiaTeslaT4 --timeout 3600
      - name: Record execution link (not an inference success claim)
        run: |
          echo "Kaggle submitted (not yet validated MP4): https://www.kaggle.com/code/mjw3177109/xunigirl-xiaoya-avatar-video-pilot" >> "$GITHUB_STEP_SUMMARY"
          kaggle kernels status mjw3177109/xunigirl-xiaoya-avatar-video-pilot || true
