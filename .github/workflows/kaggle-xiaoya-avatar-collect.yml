name: Collect Kaggle Xiaoya Avatar Video Pilot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-xiaoya-avatar-collect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: mjw3177109/xunigirl-xiaoya-sadtalker-gpu-mp4-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI and check token
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::KAGGLE_API_TOKEN missing"; exit 1; }
          python -m pip install -q --upgrade kaggle
      - name: Wait for actual Kaggle GPU inference (at most 40 minutes)
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time,os,sys
          slug=os.environ["KERNEL_SLUG"]
          for i in range(40):
              p=subprocess.run(["kaggle","kernels","status",slug],capture_output=True,text=True,timeout=60)
              status=(p.stdout+" "+p.stderr).upper()
              print(f"Poll {i+1}/40 rc={p.returncode}: {status[-230:]}",flush=True)
              if p.returncode==0 and "COMPLETE" in status and "INCOMPLETE" not in status:
                  print("Kaggle reported COMPLETE",flush=True);sys.exit(0)
              if p.returncode==0 and any(s in status for s in ("ERROR","FAILED","CANCELLED","CANCELED")):
                  sys.exit("Kaggle notebook failed; see Kaggle logs")
              time.sleep(60)
          sys.exit("Kaggle notebook not complete within 40m")
          PY
      - name: Collect Kaggle notebook files and error logs
        if: always()
        shell: bash
        run: |
          mkdir -p kaggle_video_result
          kaggle kernels output "$KERNEL_SLUG" -p kaggle_video_result -o || true
          echo "Kaggle file inventory:"
          find kaggle_video_result -maxdepth 5 -type f -printf '%p %s bytes\\n' || true
      - name: Download and validate actual MP4, never generate synthetic pass result
        shell: bash
        run: |
          mkdir -p kaggle_video_result
          python - <<'PY'
          import pathlib,json,subprocess
          root=pathlib.Path("kaggle_video_result")
          files=list(root.rglob("xiaoya_talking_pilot.mp4"))
          assert files, "Kaggle produced no actual SadTalker MP4"
          video=files[0]
          probe=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type","-of","json",str(video)],capture_output=True,text=True,check=True)
          result=json.loads(probe.stdout)
          streams={x["codec_type"] for x in result["streams"]}
          assert {"audio","video"} <= streams, f"MP4 lacks audio/video: {streams}"
          dur=float(result["format"]["duration"])
          assert 5<=dur<=15, f"MP4 duration incorrect: {dur}"
          reports=list(root.rglob("video_report.json"))
          assert reports and json.loads(reports[0].read_text())["status"]=="actual_mp4_generated"
          print("Verified real GPU MP4",video,"seconds",dur)
          PY
      - name: Upload diagnostic and final files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoya-sadtalker-gpu-pilot-output
          path: kaggle_video_result
          if-no-files-found: warn
          retention-days: 15
