name: Collect Kaggle Xiaoya Avatar Video Pilot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-xiaoya-avatar-collect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: mjw3177109/xunigirl-xiaoya-sadtalker-gpu-mp4-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q kaggle
      - name: Capture true Kaggle status and inference logs
        shell: bash
        run: |
          mkdir -p kaggle_video_result
          kaggle kernels status "$KERNEL_SLUG" 2>&1 | tee kaggle_video_result/kaggle_status.txt || true
          timeout 90s kaggle kernels logs "$KERNEL_SLUG" > kaggle_video_result/kaggle_notebook.log 2>&1 || true
          timeout 120s kaggle kernels output "$KERNEL_SLUG" -p kaggle_video_result -o --file-pattern 'xiaoya_video_results/' || true
          find kaggle_video_result -maxdepth 5 -type f -printf '%p %s bytes\n' || true
      - name: Verify MP4 with actual video and audio streams
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, json, subprocess, sys
          base=pathlib.Path('kaggle_video_result')
          clips=list(base.rglob('xiaoya_talking_pilot.mp4'))
          if not clips:
              logs=base/'kaggle_notebook.log'
              if logs.exists():
                  print('Kaggle logs tail:\n'+logs.read_text(errors='replace')[-6000:])
              sys.exit('No real MP4 from Kaggle. Logs archived for analysis.')
          p=clips[0]
          x=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type','-of','json',str(p)],capture_output=True,text=True,check=True)
          data=json.loads(x.stdout)
          streams={s['codec_type'] for s in data['streams']}
          assert {'audio','video'} <= streams, streams
          duration=float(data['format']['duration'])
          assert 5<=duration<=15, duration
          assert any(json.loads(f.read_text())['status']=='actual_mp4_generated' for f in base.rglob('video_report.json'))
          print('VERIFIED REAL MP4',str(p),'seconds',duration,'size_bytes',p.stat().st_size)
          PY
      - name: Upload MP4 or actual failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoya-sadtalker-gpu-pilot-output
          path: kaggle_video_result
          if-no-files-found: warn
          retention-days: 15
